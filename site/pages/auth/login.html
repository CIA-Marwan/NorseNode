<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norse Node | Public Demo</title>
    <link rel="icon" type="image/png" href="https://thumb.wikimedia.org/wikipedia/en/thumb/0/02/Northern_Kentucky_University_seal.svg/1280px-Northern_Kentucky_University_seal.svg.png?utm_source=en.wikipedia.org&amp;utm_campaign=index&amp;utm_content=thumbnail">
    <link rel="stylesheet" href="../../assets/css/norse-node.css">
    <script src="../../assets/js/shared/Login.js" defer></script>
</head>

<body class="login-page">
    <main class="login-layout">
        <section class="login-clock" aria-label="Current local time">
            <p class="login-clock-label">Local time</p>
            <p class="login-clock-location">Highland Heights, KY</p>
            <time class="flip-clock" id="login-clock" role="timer" aria-live="off">
                <span class="clock-digit" data-clock-digit="0">0</span>
                <span class="clock-digit" data-clock-digit="1">0</span>
                <span class="clock-separator" aria-hidden="true">:</span>
                <span class="clock-digit" data-clock-digit="2">0</span>
                <span class="clock-digit" data-clock-digit="3">0</span>
                <span class="clock-separator" aria-hidden="true">:</span>
                <span class="clock-digit" data-clock-digit="4">0</span>
                <span class="clock-digit" data-clock-digit="5">0</span>
                <span class="clock-period" id="clock-period">--</span>
            </time>
        </section>

        <section class="login-card">
            <header class="login-header">
                <p class="login-eyebrow">Public browser demo</p>
                <h1 class="login-logo">Norse Node</h1>
                <p class="login-subtitle">Browse NKU study spaces</p>
            </header>

            <section class="demo-access" aria-labelledby="demo-access-title">
                <h2 id="demo-access-title">Try the public demo</h2>
                <p>No account, password, or personal information is needed. Demo activity stays in this browser session.</p>
                <button class="login-submit" id="enter-demo" type="button">Continue to Demo</button>
            </section>
        </section>
    </main>

    <footer class="site-copyright">© 2026 Marwan Abdelrahman</footer>
</body>

</html>
