<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Innovation Center | Norse Node</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="../Main_Files/hackathon.css">
    <script src="../HIC_Floors/HIC_Page.js" defer></script>
</head>

<body class="buildings-page building-detail-page">
    <main class="buildings-main griffin-main wide-building-detail health-innovation-detail">
        <a class="building-back-link" href="../Main_Files/Pickbuild_Page.html">‹ Back to buildings</a>

        <header class="griffin-header">
            <p class="buildings-eyebrow">Norse Node study spots</p>
            <h1>Health Innovation Center</h1>
        </header>

        <section class="building-about">
            <div class="building-about-copy">
                <h2>About</h2>
                <p>Five-story LEED Silver center connected to Founders Hall.</p>
            </div>
            <div class="building-facts" aria-label="Building facts">
                <div class="building-fact">
                    <span class="building-fact-icon" aria-hidden="true">▦</span>
                    <span>5 Floors</span>
                </div>
                <div class="building-fact">
                    <span class="building-fact-icon" aria-hidden="true">✧</span>
                    <span>LEED Silver</span>
                </div>
            </div>
        </section>

        <section class="griffin-overview" aria-label="Health Innovation Center image">
            <img
                class="griffin-image full-building-image"
                src="https://www.nku.edu/campus-planning/building/academic/health-innovation-center/1612947365.jpg"
                alt="Health Innovation Center at Northern Kentucky University">
        </section>

        <section class="building-features-section" aria-labelledby="building-features-title">
            <h2 id="building-features-title">Building Features</h2>
            <div class="building-feature-list griffin-feature-list" id="hic-feature-list"></div>
        </section>

        <section class="griffin-floors-section">
            <h2>Explore by Floor</h2>
            <p>View floor study areas and study-server limits.</p>
            <div class="griffin-floor-list" id="hic-floor-list"></div>
        </section>
    </main>
</body>

</html>
