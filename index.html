<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="xO2LqZhJyQpFbVGtTxSKjuGo2BYZLcq5cOxDXfVKks8">
    <meta name="theme-color" content="#080808">
    <title>Norse Node | NKU Student Hackathon Project</title>
    <meta name="description" content="Norse Node is an independent student-developed NKU hackathon project for exploring campus study locations and simulated study groups.">
    <link rel="canonical" href="https://norsenode.dev/">
    <link rel="stylesheet" href="Main_Files/hackathon.css">
    <script src="Main_Files/Login.js" defer></script>
</head>
<body class="login-page">
    <main class="login-layout">
        <section class="login-clock" aria-label="Current local time">
            <p class="login-clock-label">Local time</p>
            <p class="login-clock-location">Highland Heights, KY</p>
            <time class="flip-clock" id="login-clock" role="timer" aria-live="off">
                <span class="clock-digit" data-clock-digit="0">0</span>
                <span class="clock-digit" data-clock-digit="1">0</span>
                <span class="clock-separator" aria-hidden="true">:</span>
                <span class="clock-digit" data-clock-digit="2">0</span>
                <span class="clock-digit" data-clock-digit="3">0</span>
                <span class="clock-separator" aria-hidden="true">:</span>
                <span class="clock-digit" data-clock-digit="4">0</span>
                <span class="clock-digit" data-clock-digit="5">0</span>
                <span class="clock-period" id="clock-period">--</span>
            </time>
        </section>

        <section class="login-card">
            <header class="login-header">
                <p class="login-eyebrow">Independent student hackathon project</p>
                <h1 class="login-logo">Norse Node</h1>
            </header>
            <button class="login-submit" id="explore-norse-node" type="button">Explore Norse Node</button>
        </section>
        <p class="login-disclaimer">Independent student project — not an official NKU service. No account or university credentials required.</p>
    </main>
    <footer class="site-copyright">© 2026 Marwan Abdelrahman</footer>
</body>
</html>
